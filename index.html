<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CityWatch</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      overflow:hidden;
      background:#f5f5f5;
    }

    #map{
      width:100vw;
      height:100vh;
    }

    /* ── Bigger Buttons ── */

    .locate-btn{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%);

      z-index:1000;

      border:none;
      border-radius:999px;

      background:#007bff;
      color:white;

      padding:14px 24px;

      font-size:16px;
      font-weight:700;

      cursor:pointer;

      box-shadow:0 4px 14px rgba(0,0,0,0.25);
    }

    .menu-btn{
      position:fixed;
      top:18px;
      left:18px;

      z-index:1001;

      width:54px;
      height:54px;

      border:none;
      border-radius:14px;

      background:white;

      font-size:26px;

      cursor:pointer;

      box-shadow:0 4px 14px rgba(0,0,0,0.18);
    }

    /* ── Menu ── */

    .menu{
      position:fixed;
      top:0;
      left:-280px;

      width:270px;
      height:100%;

      background:white;

      z-index:1002;

      padding:30px 22px;

      transition:0.3s ease;

      box-shadow:2px 0 16px rgba(0,0,0,0.18);
    }

    .menu.open{
      left:0;
    }

    .menu h3{
      margin:0;
      color:#007bff;
      font-size:24px;
    }

    .menu p{
      margin-top:5px;
      color:#888;
      font-size:14px;
    }

    .menu hr{
      border:none;
      border-top:1px solid #eee;
      margin:18px 0;
    }

    .menu-item{
      display:flex;
      align-items:center;

      padding:16px 10px;

      border-radius:12px;

      cursor:pointer;

      transition:0.2s;

      font-size:16px;
      font-weight:600;
    }

    .menu-item:hover{
      background:#f5f5f5;
    }

    .coming{
      margin-left:auto;
      font-size:11px;
      color:#aaa;
    }

    .menu-overlay{
      position:fixed;
      inset:0;

      z-index:1001;

      display:none;
    }

    .menu-overlay.show{
      display:block;
    }

    /* ── Panel ── */

    .issue-panel{
      position:fixed;
      left:0;
      right:0;
      bottom:0;

      background:white;

      z-index:1000;

      padding:22px 18px 36px;

      border-radius:24px 24px 0 0;

      transform:translateY(100%);
      transition:0.35s cubic-bezier(0.32,0.72,0,1);

      box-shadow:0 -8px 30px rgba(0,0,0,0.18);
    }

    .issue-panel.active{
      transform:translateY(0);
    }

    .panel-handle{
      width:50px;
      height:5px;

      margin:0 auto 16px;

      background:#ddd;

      border-radius:3px;
    }

    .issue-panel h3{
      margin:0 0 16px;
      font-size:20px;
    }

    /* ── Bigger Type Buttons ── */

    .type-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;

      margin-bottom:16px;
    }

    .type-btn{
      border:2px solid #e0e0e0;
      background:white;

      border-radius:14px;

      padding:14px 6px;

      font-size:13px;

      cursor:pointer;

      transition:0.2s;
    }

    .type-btn.selected{
      border-color:#007bff;
      background:#e8f0fe;
      color:#007bff;
      font-weight:700;
    }

    textarea{
      width:100%;

      border:2px solid #e0e0e0;
      border-radius:12px;

      padding:14px;

      font-size:15px;

      resize:none;

      outline:none;

      margin-bottom:14px;
    }

    textarea:focus{
      border-color:#007bff;
    }

    /* ── Photo ── */

    .photo-label{
      display:flex;
      align-items:center;
      justify-content:center;

      border:2px dashed #ccc;
      border-radius:12px;

      padding:16px;

      margin-bottom:14px;

      cursor:pointer;

      font-size:15px;
      font-weight:700;

      color:#666;

      transition:0.2s;
    }

    .photo-label:hover{
      border-color:#007bff;
      color:#007bff;
    }

    #photoPreview img{
      width:100%;
      max-height:220px;

      object-fit:cover;

      border-radius:12px;

      margin-bottom:14px;
    }

    /* ── Action Buttons ── */

    .panel-actions{
      display:flex;
      gap:10px;
    }

    .panel-actions button{
      flex:1;

      padding:16px;

      border:none;
      border-radius:12px;

      font-size:16px;
      font-weight:700;

      cursor:pointer;
    }

    #submitBtn{
      background:#007bff;
      color:white;
    }

    #cancelBtn{
      background:#f0f0f0;
      color:#555;
    }

    /* ── Emoji Markers ── */

    .emoji-marker div{
      width:48px;
      height:48px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:32px;

      background:white;

      border-radius:50%;

      border:2px solid white;

      box-shadow:0 2px 12px rgba(0,0,0,0.28);
    }

    /* ── Popup Delete Button ── */

    .delete-btn{
      margin-top:10px;

      border:none;
      border-radius:8px;

      background:#ff3b30;
      color:white;

      padding:8px 12px;

      font-size:13px;
      font-weight:700;

      cursor:pointer;
    }

    /* ── Toast ── */

    .toast{
      position:fixed;
      bottom:100px;
      left:50%;

      transform:translateX(-50%);

      background:#111;
      color:white;

      padding:12px 22px;

      border-radius:999px;

      font-size:14px;
      font-weight:700;

      opacity:0;

      transition:0.3s;

      z-index:3000;
    }

    .toast.show{
      opacity:1;
    }

  </style>
</head>

<body>

  <div id="map"></div>

  <div class="toast" id="toast"></div>

  <button class="locate-btn" id="locateBtn">
    📍 Find My Location
  </button>

  <button class="menu-btn" id="menuBtn">
    ☰
  </button>

  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- Menu -->

  <div class="menu" id="menu">

    <h3>🗺️ CityWatch</h3>

    <p>Community Issue Map</p>

    <hr>

    <div class="menu-item">
      📍 Report an Issue
    </div>

    <div class="menu-item">
      📊 Stats
      <span class="coming">coming soon</span>
    </div>

    <div class="menu-item">
      🎛️ Filters
      <span class="coming">coming soon</span>
    </div>

  </div>

  <!-- Panel -->

  <div class="issue-panel" id="panel">

    <div class="panel-handle"></div>

    <h3>📌 Report an Issue</h3>

    <div class="type-grid">

      <button class="type-btn" data-type="Pothole">
        🕳️<br>Pothole
      </button>

      <button class="type-btn" data-type="Trash">
        🗑️<br>Trash
      </button>

      <button class="type-btn" data-type="Leak">
        💧<br>Leak
      </button>

      <button class="type-btn" data-type="Light">
        💡<br>Light
      </button>

      <button class="type-btn" data-type="Other">
        ⚠️<br>Other
      </button>

    </div>

    <textarea
      id="desc"
      rows="3"
      placeholder="Describe the issue..."
    ></textarea>

    <label class="photo-label" for="photoInput">
      📷 Take / Upload Photo
    </label>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      capture="environment"
      hidden
    >

    <div id="photoPreview" style="display:none;">
      <img id="previewImg">
    </div>

    <div class="panel-actions">

      <button id="cancelBtn">
        Cancel
      </button>

      <button id="submitBtn">
        Submit Report
      </button>

    </div>

  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc
    }
    from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    /* ── Firebase ── */

    const firebaseConfig = {

      apiKey: "AIzaSyBT8j239aELPwxD0iQcQj6fdnhQVHNuMLU",

      authDomain:"community-map-125ba.firebaseapp.com",

      projectId:"community-map-125ba",

      storageBucket:"community-map-125ba.firebasestorage.app",

      messagingSenderId: "1016337399487",

      appId:"1:1016337399487:web:77ba8a7b8c89fd850fd00a",
      measurementId: "G-7NYRJ3B89Q"

    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const reportsRef = collection(db,"reports");

    /* ── Map ── */

    const map = L.map("map")
      .setView([-26.2041,28.0473],13);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:"© OpenStreetMap contributors"
      }
    ).addTo(map);

    /* ── Emoji Icons ── */

    function createEmojiIcon(emoji){

      return L.divIcon({

        className:"emoji-marker",

        html:`<div>${emoji}</div>`,

        iconSize:[48,48],

        iconAnchor:[24,24],

        popupAnchor:[0,-24]

      });

    }

    const icons = {

      Pothole:createEmojiIcon("🕳️"),

      Trash:createEmojiIcon("🗑️"),

      Leak:createEmojiIcon("💧"),

      Light:createEmojiIcon("💡"),

      Other:createEmojiIcon("⚠️")

    };

    /* ── Reports ── */

    const markers = {};

    onSnapshot(reportsRef,snapshot=>{

      snapshot.docChanges().forEach(change=>{

        const id = change.doc.id;

        const r = change.doc.data();

        if(change.type==="added"){

          let popup = `

            <b>${r.type}</b><br>

            ${r.description}

          `;

          if(r.photoUrl){

            popup += `

              <br>

              <img
                src="${r.photoUrl}"
                style="
                  width:100%;
                  margin-top:8px;
                  border-radius:10px;
                  max-height:200px;
                  object-fit:cover;
                "
              >

            `;

          }

          popup += `

            <br>

            <button
              class="delete-btn"
              onclick="deleteReport('${id}')"
            >
              🗑️ Delete Report
            </button>

          `;

          markers[id] = L.marker(
            [r.lat,r.lng],
            {
              icon:icons[r.type] || icons.Other
            }
          )
          .addTo(map)
          .bindPopup(popup);

        }

        if(change.type==="removed"){

          if(markers[id]){

            map.removeLayer(markers[id]);

            delete markers[id];

          }

        }

      });

    });

    /* ── Delete ── */

    window.deleteReport = async(id)=>{

      try{

        await deleteDoc(doc(db,"reports",id));

        showToast("🗑️ Report deleted");

      }

      catch(err){

        console.error(err);

        showToast("❌ Failed to delete");

      }

    };

    /* ── Menu ── */

    const menu =
      document.getElementById("menu");

    const overlay =
      document.getElementById("menuOverlay");

    document.getElementById("menuBtn").onclick=()=>{

      menu.classList.toggle("open");

      overlay.classList.toggle("show");

    };

    overlay.onclick=()=>{

      menu.classList.remove("open");

      overlay.classList.remove("show");

    };

    /* ── Location ── */

    document.getElementById("locateBtn").onclick=()=>{

      navigator.geolocation.getCurrentPosition(pos=>{

        const lat = pos.coords.latitude;

        const lng = pos.coords.longitude;

        map.setView([lat,lng],17);

        L.circleMarker(
          [lat,lng],
          {
            radius:12,
            color:"#007bff",
            fillColor:"#007bff",
            fillOpacity:1
          }
        )
        .addTo(map)
        .bindPopup("📍 You are here")
        .openPopup();

      });

    };

    /* ── Report System ── */

    let pendingLocation = null;

    let selectedType = "Other";

    let photoBase64 = null;

    const photoInput =
      document.getElementById("photoInput");

    const previewImg =
      document.getElementById("previewImg");

    const photoPreview =
      document.getElementById("photoPreview");

    photoInput.onchange=()=>{

      const file = photoInput.files[0];

      if(!file) return;

      const reader = new FileReader();

      reader.onload=e=>{

        const img = new Image();

        img.onload=()=>{

          const canvas =
            document.createElement("canvas");

          const MAX = 700;

          let w = img.width;

          let h = img.height;

          if(w > h && w > MAX){

            h = h * MAX / w;

            w = MAX;

          }

          else if(h > MAX){

            w = w * MAX / h;

            h = MAX;

          }

          canvas.width = w;

          canvas.height = h;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(img,0,0,w,h);

          photoBase64 =
            canvas.toDataURL(
              "image/jpeg",
              0.6
            );

          previewImg.src = photoBase64;

          photoPreview.style.display="block";

        };

        img.src = e.target.result;

      };

      reader.readAsDataURL(file);

    };

    document.querySelectorAll(".type-btn")
    .forEach(btn=>{

      btn.onclick=()=>{

        document.querySelectorAll(".type-btn")
        .forEach(b=>b.classList.remove("selected"));

        btn.classList.add("selected");

        selectedType = btn.dataset.type;

      };

    });

    map.on("click",e=>{

      pendingLocation = e.latlng;

      document.getElementById("desc").value="";

      photoBase64 = null;

      photoInput.value="";

      photoPreview.style.display="none";

      document.getElementById("panel")
      .classList.add("active");

    });

    document.getElementById("cancelBtn").onclick=()=>{

      document.getElementById("panel")
      .classList.remove("active");

    };

    document.getElementById("submitBtn").onclick=async()=>{

      const desc =
        document.getElementById("desc")
        .value
        .trim();

      if(!pendingLocation) return;

      if(!desc){

        showToast("Please describe the issue.");

        return;

      }

      try{

        await addDoc(reportsRef,{

          type:selectedType,

          description:desc,

          lat:pendingLocation.lat,

          lng:pendingLocation.lng,

          photoUrl:photoBase64 || null,

          timestamp:new Date().toISOString()

        });

        document.getElementById("panel")
        .classList.remove("active");

        showToast("✅ Report submitted!");

      }

      catch(err){

        console.error(err);

        showToast("❌ Failed to submit");

      }

    };

    /* ── Toast ── */

    function showToast(msg){

      const toast =
        document.getElementById("toast");

      toast.textContent = msg;

      toast.classList.add("show");

      setTimeout(()=>{

        toast.classList.remove("show");

      },3000);

    }

  </script>

</body>
</html>
