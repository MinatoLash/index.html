<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Live Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 12px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #475569; font-size: 0.95rem; }
    button {
      margin-top: 12px;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      width: 100%;
    }
    #map {
      width: 100%;
      height: 65vh;
      min-height: 420px;
      border-radius: 18px;
    }
    .coords {
      font-size: 0.85rem;
      word-break: break-all;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Community Live Map</h1>
      <p>Explore your city like a live community health map. Move around neighborhoods, view area conditions, and understand where issues are concentrated.</p>
      <button id="trackBtn">Start Tracking</button>
            <div id="coords" class="coords"></div>
      <button id="centerBtn" style="margin-top:8px; background:#0f172a;">Center On Me</button>
      
    </div>

    <div class="card">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-26.2041, 28.0473], 11);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const issueZones = [
      { coords: [-26.205, 28.045], radius: 900, color: '#f59e0b', opacity: 0.18 },
      { coords: [-26.208, 28.052], radius: 1200, color: '#ef4444', opacity: 0.12 },
      { coords: [-26.201, 28.040], radius: 700, color: '#22c55e', opacity: 0.08 }
    ];

    issueZones.forEach(zone => {
      L.circle(zone.coords, {
        radius: zone.radius,
        color: zone.color,
        fillColor: zone.color,
        fillOpacity: zone.opacity,
        weight: 1
      }).addTo(map);
    });

    
    for (let lat = -90; lat <= 90; lat += 0.02) {
      L.polyline([[lat, -180], [lat, 180]], {
        color: '#cbd5e1',
        weight: 0.5,
        opacity: 0.3
      }).addTo(map);
    }

    for (let lng = -180; lng <= 180; lng += 0.02) {
      L.polyline([[-90, lng], [90, lng]], {
        color: '#cbd5e1',
        weight: 0.5,
        opacity: 0.3
      }).addTo(map);
    }

    let marker = null;
    let territoryCircle = null;
    let outerCircle = null;
    let zoneInitialized = false;
    let watchId = null;
    let tracking = false;

    const trackBtn = document.getElementById('trackBtn');
    const centerBtn = document.getElementById('centerBtn');
    const coordsEl = document.getElementById('coords');
    
    centerBtn.addEventListener('click', () => {
      if (marker) {
        map.setView(marker.getLatLng(), 11, { animate: true });
      }
    });

    trackBtn.addEventListener('click', () => {
      if (tracking) {
        navigator.geolocation.clearWatch(watchId);
        tracking = false;
        trackBtn.textContent = 'Start Tracking';
        return;
      }

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const coords = [lat, lng];

          if (!marker) {
            marker = L.marker(coords).addTo(map);
          } else {
            marker.setLatLng(coords);
          }

          if (!zoneInitialized) {
            territoryCircle = L.circle(coords, {
              radius: 600,
              color: '#84cc16',
              fillColor: '#84cc16',
              fillOpacity: 0.12,
              weight: 2
            }).addTo(map);

            outerCircle = L.circle(coords, {
              radius: 1400,
              color: '#84cc16',
              fillOpacity: 0.03,
              weight: 2
            }).addTo(map);

            zoneInitialized = true;
          }

          if (territoryCircle) territoryCircle.setLatLng(coords);
          if (outerCircle) outerCircle.setLatLng(coords);

          map.setView(coords, 11, { animate: true });
          coordsEl.textContent = `Current Area Center: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        },
        () => alert('Unable to retrieve location'),
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );

      tracking = true;
      trackBtn.textContent = 'Stop Tracking';
    });
  </script>
</body>
</html>
