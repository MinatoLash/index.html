<!DOCTYPE html>
<html>
<head>
  <title>Community Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #map { 
      height: 100vh; 
      position: relative;
    }
    .issue-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 20px;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      max-height: 70vh;
      overflow-y: auto;
    }
    .issue-panel.active {
      transform: translateY(0);
    }
    .issue-types {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }
    .issue-btn {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .issue-btn:hover {
      border-color: #007bff;
      background: #f8f9fa;
    }
    .issue-btn.selected {
      border-color: #007bff;
      background: #007bff;
      color: white;
    }
    .issue-icon {
      font-size: 24px;
      margin-bottom: 5px;
    }
    .issue-label {
      font-size: 12px;
      font-weight: 600;
    }
    .description-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    .submit-btn, .cancel-btn {
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 5px;
    }
    .submit-btn {
      background: #007bff;
      color: white;
      width: calc(50% - 10px);
    }
    .cancel-btn {
      background: #f8f9fa;
      color: #333;
      width: calc(50% - 10px);
    }
    .location-loading {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 1001;
      display: none;
    }
    @media (max-width: 768px) {
      .issue-panel {
        padding: 15px;
      }
      .issue-types {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
<div id="map"></div>

<div class="location-loading" id="locationLoading">
  📍 Getting your location...
</div>

<div class="issue-panel" id="issuePanel">
  <h3 style="margin-top: 0; margin-bottom: 15px;">Report an Issue</h3>
  
  <div class="issue-types">
    <div class="issue-btn" data-type="Pothole">
      <div class="issue-icon">🕳️</div>
      <div class="issue-label">Pothole</div>
    </div>
    <div class="issue-btn" data-type="Broken Light">
      <div class="issue-icon">💡</div>
      <div class="issue-label">Broken Light</div>
    </div>
    <div class="issue-btn" data-type="Trash">
      <div class="issue-icon">🗑️</div>
      <div class="issue-label">Trash</div>
    </div>
    <div class="issue-btn" data-type="Graffiti">
      <div class="issue-icon">🎨</div>
      <div class="issue-label">Graffiti</div>
    </div>
    <div class="issue-btn" data-type="Leak">
      <div class="issue-icon">💧</div>
      <div class="issue-label">Water Leak</div>
    </div>
    <div class="issue-btn" data-type="Other">
      <div class="issue-icon">⚠️</div>
      <div class="issue-label">Other</div>
    </div>
  </div>
  
  <input type="text" class="description-input" id="descriptionInput" placeholder="Describe the issue...">
  
  <div style="text-align: center;">
    <button class="submit-btn" id="submitBtn">Submit Report</button>
    <button class="cancel-btn" id="cancelBtn">Cancel</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  let map = L.map('map').setView([-26.2041, 28.0473], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Load reports from localStorage
  let reports = JSON.parse(localStorage.getItem("reports")) || [];
  let selectedIssueType = null;
  let pendingLocation = null;

  // UI Elements
  const issuePanel = document.getElementById('issuePanel');
  const locationLoading = document.getElementById('locationLoading');
  const descriptionInput = document.getElementById('descriptionInput');
  const submitBtn = document.getElementById('submitBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const issueButtons = document.querySelectorAll('.issue-btn');

  // Load existing reports on startup
  reports.forEach(report => {
    const marker = L.marker([report.lat, report.lng]).addTo(map);
    marker.bindPopup(`<b>${report.type}</b><br>${report.description}`);
  });

  // Ultra-fast location detection with multiple fallbacks
  function getLocation() {
    locationLoading.style.display = 'block';
    
    // Try fast location first (low accuracy, fast response)
    const fastOptions = {
      enableHighAccuracy: false,
      timeout: 3000, // 3 seconds timeout
      maximumAge: 600000 // 10 minutes cache
    };

    let locationFound = false;

    // Fast attempt
    navigator.geolocation.getCurrentPosition(
      position => {
        if (!locationFound) {
          locationFound = true;
          setLocation(position.coords.latitude, position.coords.longitude);
        }
      },
      error => {
        // If fast fails, try high accuracy
        if (!locationFound) {
          tryHighAccuracy();
        }
      },
      fastOptions
    );

    // High accuracy fallback
    function tryHighAccuracy() {
      const highAccuracyOptions = {
        enableHighAccuracy: true,
        timeout: 5000, // 5 seconds timeout
        maximumAge: 0 // No cache
      };

      navigator.geolocation.getCurrentPosition(
        position => {
          if (!locationFound) {
            locationFound = true;
            setLocation(position.coords.latitude, position.coords.longitude);
          }
        },
        error => {
          // Final fallback - use IP-based location or default
          if (!locationFound) {
            locationFound = true;
            console.log('Using fallback location');
            // Try browser geolocation API as last resort
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                pos => setLocation(pos.coords.latitude, pos.coords.longitude),
                () => useDefaultLocation(),
                { timeout: 2000 }
              );
            } else {
              useDefaultLocation();
            }
          }
        },
        highAccuracyOptions
      );
    }

    function setLocation(lat, lng) {
      map.setView([lat, lng], 15);

      L.circleMarker([lat, lng], {
        color: '#007bff',
        fillColor: '#007bff',
        fillOpacity: 0.5,
        radius: 10,
        weight: 3
      }).addTo(map).bindPopup("📍 You are here");

      locationLoading.style.display = 'none';
    }

    function useDefaultLocation() {
      map.setView([-26.2041, 28.0473], 13);
      locationLoading.style.display = 'none';
    }

    // Safety net - if nothing works after 8 seconds, use default
    setTimeout(() => {
      if (!locationFound) {
        locationFound = true;
        useDefaultLocation();
      }
    }, 8000);
  }

  // Get location immediately
  getLocation();

  // Issue type selection
  issueButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      issueButtons.forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
      selectedIssueType = this.dataset.type;
    });
  });

  // Submit report
  submitBtn.addEventListener('click', function() {
    const description = descriptionInput.value.trim();
    
    if (!selectedIssueType) {
      alert('Please select an issue type');
      return;
    }
    
    if (!description) {
      alert('Please describe the issue');
      return;
    }

    if (!pendingLocation) {
      alert('Please click on the map to select a location');
      return;
    }

    const report = {
      lat: pendingLocation.lat,
      lng: pendingLocation.lng,
      type: selectedIssueType,
      description: description,
      timestamp: new Date().toISOString()
    };

    // Save to localStorage
    reports.push(report);
    localStorage.setItem("reports", JSON.stringify(reports));

    // Add marker to map
    const marker = L.marker([pendingLocation.lat, pendingLocation.lng]).addTo(map);
    marker.bindPopup(`<b>${selectedIssueType}</b><br>${description}`).openPopup();

    // Reset form
    closeIssuePanel();
  });

  // Cancel report
  cancelBtn.addEventListener('click', closeIssuePanel);

  function closeIssuePanel() {
    issuePanel.classList.remove('active');
    selectedIssueType = null;
    pendingLocation = null;
    descriptionInput.value = '';
    issueButtons.forEach(b => b.classList.remove('selected'));
  }

  // Click to create report
  map.on('click', function(e) {
    pendingLocation = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };
    
    // Show issue panel
    issuePanel.classList.add('active');
    
    // Focus on description input
    setTimeout(() => {
      descriptionInput.focus();
    }, 300);
  });

  // Touch support for mobile
  if ('ontouchstart' in window) {
    map.dragging.enable();
    map.touchZoom.enable();
    map.doubleClickZoom.enable();
    map.scrollWheelZoom.disable();
  }
</script>
</body>
</html>
