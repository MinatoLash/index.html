<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Live Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 12px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #475569; font-size: 0.95rem; }
    button {
      margin-top: 12px;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      width: 100%;
    }
    #map {
      width: 100%;
      height: 65vh;
      min-height: 420px;
      border-radius: 18px;
    }
    .coords {
      font-size: 0.85rem;
      word-break: break-all;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Community Live Map</h1>
      <p>Track your live location and follow movement on the map.</p>
      <button id="trackBtn">Start Tracking</button>
      <div id="coords" class="coords"></div>
    </div>

    <div class="card">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-26.2041, 28.0473], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let watchId = null;
    let tracking = false;

    const trackBtn = document.getElementById('trackBtn');
    const coordsEl = document.getElementById('coords');

    trackBtn.addEventListener('click', () => {
      if (tracking) {
        navigator.geolocation.clearWatch(watchId);
        tracking = false;
        trackBtn.textContent = 'Start Tracking';
        return;
      }

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const coords = [lat, lng];

          if (!marker) {
            marker = L.marker(coords).addTo(map);
          } else {
            marker.setLatLng(coords);
          }

          map.setView(coords, 16, { animate: true });
          coordsEl.textContent = `Current Position: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        },
        () => alert('Unable to retrieve location'),
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );

      tracking = true;
      trackBtn.textContent = 'Stop Tracking';
    });
  </script>
</body>
</html>
