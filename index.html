<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Community Issue Reporter</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
  background:#f4f4f4;
}

/* ───────────────── MAP ───────────────── */

#map{
  width:100vw;
  height:100vh;
  z-index:1;
}

/* ───────────────── TOP HEADER ───────────────── */

.top-header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  z-index:1200;

  background:white;

  padding:22px 20px 18px;

  text-align:center;

  box-shadow:0 2px 18px rgba(0,0,0,0.08);
}

.top-header h1{
  font-size:20px;
  font-weight:700;
  color:#111;
}

.top-header p{
  margin-top:4px;
  font-size:13px;
  color:#777;
}

/* ───────────────── MENU BUTTON ───────────────── */

.menu-btn{
  position:fixed;
  top:22px;
  left:18px;

  z-index:1300;

  width:44px;
  height:44px;

  border:none;
  border-radius:14px;

  background:white;

  font-size:20px;
  cursor:pointer;

  box-shadow:0 4px 16px rgba(0,0,0,0.12);
}

/* ───────────────── LOCATION BUTTON ───────────────── */

.locate-btn{
  position:fixed;
  top:115px;
  right:18px;

  z-index:1200;

  border:none;
  border-radius:18px;

  background:white;

  padding:16px 20px;

  font-size:16px;
  font-weight:600;

  display:flex;
  align-items:center;
  gap:12px;

  cursor:pointer;

  box-shadow:0 6px 18px rgba(0,0,0,0.12);
}

.locate-btn i{
  font-size:20px;
}

/* ───────────────── SIDE MENU ───────────────── */

.menu{
  position:fixed;
  top:0;
  left:-280px;

  width:260px;
  height:100vh;

  background:white;

  z-index:1400;

  padding:26px 20px;

  transition:0.35s ease;

  box-shadow:2px 0 20px rgba(0,0,0,0.15);
}

.menu.open{
  left:0;
}

.menu h2{
  color:#111;
  font-size:24px;
}

.menu p{
  margin-top:4px;
  color:#777;
  font-size:13px;
}

.menu hr{
  border:none;
  border-top:1px solid #eee;
  margin:20px 0;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:12px;

  padding:14px;

  border-radius:14px;

  cursor:pointer;

  transition:0.2s;
}

.menu-item:hover{
  background:#f5f5f5;
}

.menu-item i{
  width:22px;
}

.menu-overlay{
  position:fixed;
  inset:0;

  z-index:1350;

  background:rgba(0,0,0,0.25);

  opacity:0;
  pointer-events:none;

  transition:0.25s;
}

.menu-overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* ───────────────── BOTTOM ISSUE BAR ───────────────── */

.bottom-panel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  z-index:1200;

  background:white;

  padding:18px 14px 26px;

  border-radius:26px 26px 0 0;

  box-shadow:0 -8px 30px rgba(0,0,0,0.14);
}

.issue-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.issue-btn{
  border:none;

  border-radius:18px;

  color:white;

  height:92px;

  font-size:14px;
  font-weight:700;

  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;

  transition:0.2s;
}

.issue-btn i{
  font-size:24px;
}

.issue-btn:hover{
  transform:translateY(-2px);
}

.issue-btn.selected{
  outline:4px solid rgba(255,255,255,0.8);
  transform:scale(1.03);
}

.pothole{
  background:#ff7300;
}

.dumping{
  background:#ff2341;
}

.sewage{
  background:#287bff;
}

.light{
  background:#f2b600;
}

.other{
  background:#7b8190;
}

.report-count{
  text-align:center;
  margin-top:18px;
  color:#666;
  font-size:14px;
}

/* ───────────────── REPORT MODAL ───────────────── */

.report-modal{
  position:fixed;
  inset:0;

  z-index:1600;

  display:flex;
  align-items:flex-end;

  background:rgba(0,0,0,0.35);

  opacity:0;
  pointer-events:none;

  transition:0.25s;
}

.report-modal.active{
  opacity:1;
  pointer-events:auto;
}

.report-card{
  width:100%;

  background:white;

  border-radius:28px 28px 0 0;

  padding:24px 18px 34px;

  transform:translateY(100%);
  transition:0.35s cubic-bezier(0.32,0.72,0,1);
}

.report-modal.active .report-card{
  transform:translateY(0);
}

.drag-line{
  width:50px;
  height:5px;

  background:#ddd;

  border-radius:999px;

  margin:0 auto 18px;
}

.report-card h3{
  margin-bottom:14px;
  font-size:20px;
}

textarea{
  width:100%;
  border:2px solid #e5e5e5;
  border-radius:16px;

  padding:14px;

  font-size:15px;

  resize:none;
  outline:none;

  margin-bottom:14px;
}

textarea:focus{
  border-color:#287bff;
}

.photo-btn{
  width:100%;

  border:2px dashed #ccc;
  border-radius:16px;

  padding:16px;

  background:#fafafa;

  cursor:pointer;

  text-align:center;

  font-weight:600;

  color:#666;

  margin-bottom:14px;
}

.photo-btn:hover{
  border-color:#287bff;
  color:#287bff;
}

#photoPreview{
  display:none;
  margin-bottom:14px;
}

#photoPreview img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:16px;
}

.modal-actions{
  display:flex;
  gap:12px;
}

.modal-actions button{
  flex:1;

  border:none;
  border-radius:16px;

  padding:15px;

  font-size:15px;
  font-weight:700;

  cursor:pointer;
}

.cancel-btn{
  background:#efefef;
}

.submit-btn{
  background:#287bff;
  color:white;
}

/* ───────────────── ISSUE MARKERS ───────────────── */

.custom-marker{
  width:54px;
  height:54px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:24px;

  border:4px solid white;

  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.orange{
  background:#ff7300;
}

.red{
  background:#ff2341;
}

.blue{
  background:#287bff;
}

.yellow{
  background:#f2b600;
}

.gray{
  background:#7b8190;
}

/* ───────────────── USER LOCATION ───────────────── */

.user-location{
  width:22px;
  height:22px;

  background:#287bff;

  border-radius:50%;

  border:4px solid white;

  box-shadow:0 0 0 10px rgba(40,123,255,0.2);
}

/* ───────────────── TOAST ───────────────── */

.toast{
  position:fixed;
  left:50%;
  bottom:150px;

  transform:translateX(-50%);

  z-index:2000;

  background:#111;
  color:white;

  padding:12px 22px;

  border-radius:999px;

  font-size:14px;
  font-weight:600;

  opacity:0;

  transition:0.3s;
}

.toast.show{
  opacity:1;
}

/* ───────────────── MOBILE ───────────────── */

@media(max-width:700px){

  .issue-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .issue-btn{
    height:85px;
  }

}

</style>
</head>

<body>

<!-- MAP -->

<div id="map"></div>

<!-- HEADER -->

<div class="top-header">

  <h1>Community Issue Reporter</h1>

  <p>Select an issue type below, then click on the map</p>

</div>

<!-- MENU BUTTON -->

<button class="menu-btn" id="menuBtn">
  ☰
</button>

<!-- LOCATE -->

<button class="locate-btn" id="locateBtn">

  <i class="fa-solid fa-location-arrow"></i>

  Find My Location

</button>

<!-- SIDE MENU -->

<div class="menu-overlay" id="menuOverlay"></div>

<div class="menu" id="menu">

  <h2>CityWatch</h2>

  <p>Community Monitoring System</p>

  <hr>

  <div class="menu-item">
    <i class="fa-solid fa-map-location-dot"></i>
    Report Issue
  </div>

  <div class="menu-item">
    <i class="fa-solid fa-chart-simple"></i>
    Statistics
  </div>

  <div class="menu-item">
    <i class="fa-solid fa-filter"></i>
    Filters
  </div>

  <div class="menu-item">
    <i class="fa-solid fa-gear"></i>
    Settings
  </div>

</div>

<!-- BOTTOM BAR -->

<div class="bottom-panel">

  <div class="issue-grid">

    <button
      class="issue-btn pothole"
      data-type="Pothole"
    >
      <i class="fa-solid fa-triangle-exclamation"></i>
      Pothole
    </button>

    <button
      class="issue-btn dumping"
      data-type="Illegal Dumping"
    >
      <i class="fa-solid fa-trash"></i>
      Illegal Dumping
    </button>

    <button
      class="issue-btn sewage"
      data-type="Sewage Leak"
    >
      <i class="fa-solid fa-droplet"></i>
      Sewage Leak
    </button>

    <button
      class="issue-btn light"
      data-type="Street Light"
    >
      <i class="fa-regular fa-lightbulb"></i>
      Street Light
    </button>

    <button
      class="issue-btn other"
      data-type="Other Issue"
    >
      <i class="fa-solid fa-plus"></i>
      Other Issue
    </button>

  </div>

  <div class="report-count" id="reportCount">
    📍 0 issues reported
  </div>

</div>

<!-- REPORT MODAL -->

<div class="report-modal" id="reportModal">

  <div class="report-card">

    <div class="drag-line"></div>

    <h3>Report Issue</h3>

    <textarea
      id="description"
      rows="4"
      placeholder="Describe the issue..."
    ></textarea>

    <label class="photo-btn" for="photoInput">
      📷 Take / Upload Photo
    </label>

    <input
      type="file"
      accept="image/*"
      capture="environment"
      id="photoInput"
      hidden
    >

    <div id="photoPreview">
      <img id="previewImg">
    </div>

    <div class="modal-actions">

      <button
        class="cancel-btn"
        id="cancelBtn"
      >
        Cancel
      </button>

      <button
        class="submit-btn"
        id="submitBtn"
      >
        Submit Report
      </button>

    </div>

  </div>

</div>

<!-- TOAST -->

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

/* ───────────────── FIREBASE ───────────────── */

const firebaseConfig = {

  apiKey:"YOUR_API_KEY",

  authDomain:"YOUR_AUTH_DOMAIN",

  projectId:"YOUR_PROJECT_ID",

  storageBucket:"YOUR_STORAGE_BUCKET",

  messagingSenderId:"YOUR_SENDER_ID",

  appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const reportsRef = collection(db,"reports");

/* ───────────────── MAP ───────────────── */

const map = L.map("map",{
  zoomControl:false
})
.setView([-26.2041,28.0473],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"© OpenStreetMap"
  }
).addTo(map);

/* ───────────────── ISSUE ICONS ───────────────── */

function createMarker(color,icon){

  return L.divIcon({

    className:"",

    html:`
      <div class="custom-marker ${color}">
        <i class="${icon}"></i>
      </div>
    `,

    iconSize:[54,54],

    iconAnchor:[27,27],

    popupAnchor:[0,-24]

  });

}

const markerIcons = {

  "Pothole":
    createMarker(
      "orange",
      "fa-solid fa-triangle-exclamation"
    ),

  "Illegal Dumping":
    createMarker(
      "red",
      "fa-solid fa-trash"
    ),

  "Sewage Leak":
    createMarker(
      "blue",
      "fa-solid fa-droplet"
    ),

  "Street Light":
    createMarker(
      "yellow",
      "fa-regular fa-lightbulb"
    ),

  "Other Issue":
    createMarker(
      "gray",
      "fa-solid fa-plus"
    )

};

/* ───────────────── REALTIME REPORTS ───────────────── */

let reportCounter = 0;

onSnapshot(reportsRef,snapshot=>{

  snapshot.docChanges().forEach(change=>{

    if(change.type === "added"){

      const r = change.doc.data();

      reportCounter++;

      document.getElementById("reportCount")
      .innerHTML =
      `📍 ${reportCounter} issues reported`;

      L.marker(
        [r.lat,r.lng],
        {
          icon:
            markerIcons[r.type]
            || markerIcons["Other Issue"]
        }
      )
      .addTo(map)
      .bindPopup(`

        <div style="min-width:180px;">

          <b style="font-size:16px;">
            ${r.type}
          </b>

          <br><br>

          ${r.description}

          ${
            r.photoUrl
            ?
            `
            <br><br>

            <img
              src="${r.photoUrl}"
              style="
                width:100%;
                border-radius:12px;
              "
            >
            `
            :
            ""
          }

        </div>

      `);

    }

  });

});

/* ───────────────── MENU ───────────────── */

const menu =
document.getElementById("menu");

const overlay =
document.getElementById("menuOverlay");

document.getElementById("menuBtn")
.onclick=()=>{

  menu.classList.toggle("open");

  overlay.classList.toggle("show");

};

overlay.onclick=()=>{

  menu.classList.remove("open");

  overlay.classList.remove("show");

};

/* ───────────────── LOCATION TRACKING ───────────────── */

let userMarker = null;

document.getElementById("locateBtn")
.onclick=()=>{

  if(!navigator.geolocation){

    showToast("Geolocation not supported");

    return;

  }

  navigator.geolocation.watchPosition(

    position=>{

      const lat =
      position.coords.latitude;

      const lng =
      position.coords.longitude;

      map.setView([lat,lng],17);

      if(!userMarker){

        userMarker = L.marker(
          [lat,lng],
          {
            icon:L.divIcon({

              className:"",

              html:`
                <div class="user-location"></div>
              `,

              iconSize:[22,22],

              iconAnchor:[11,11]

            })
          }
        ).addTo(map);

      }

      else{

        userMarker.setLatLng([lat,lng]);

      }

    },

    err=>{

      console.error(err);

      showToast("Location permission denied");

    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:15000
    }

  );

};

/* ───────────────── REPORT SYSTEM ───────────────── */

let selectedType = "Pothole";

let pendingLatLng = null;

let photoBase64 = null;

document.querySelectorAll(".issue-btn")
.forEach(btn=>{

  btn.onclick=()=>{

    document.querySelectorAll(".issue-btn")
    .forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    selectedType = btn.dataset.type;

    showToast(
      `${selectedType} selected`
    );

  };

});

document.querySelector(".issue-btn")
.classList.add("selected");

map.on("click",e=>{

  pendingLatLng = e.latlng;

  document.getElementById("reportModal")
  .classList.add("active");

});

/* ───────────────── PHOTO ───────────────── */

const photoInput =
document.getElementById("photoInput");

photoInput.onchange=()=>{

  const file = photoInput.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload=e=>{

    photoBase64 = e.target.result;

    document.getElementById("previewImg")
    .src = photoBase64;

    document.getElementById("photoPreview")
    .style.display = "block";

  };

  reader.readAsDataURL(file);

};

/* ───────────────── SUBMIT ───────────────── */

document.getElementById("cancelBtn")
.onclick=()=>{

  document.getElementById("reportModal")
  .classList.remove("active");

};

document.getElementById("submitBtn")
.onclick=async()=>{

  if(!pendingLatLng){

    showToast("Select a location");

    return;

  }

  const description =
  document.getElementById("description")
  .value
  .trim();

  if(!description){

    showToast("Describe the issue");

    return;

  }

  try{

    await addDoc(reportsRef,{

      type:selectedType,

      description,

      lat:pendingLatLng.lat,

      lng:pendingLatLng.lng,

      photoUrl:photoBase64 || null,

      timestamp:new Date().toISOString()

    });

    document.getElementById("reportModal")
    .classList.remove("active");

    document.getElementById("description")
    .value = "";

    document.getElementById("photoPreview")
    .style.display = "none";

    photoBase64 = null;

    showToast("✅ Report submitted");

  }

  catch(err){

    console.error(err);

    showToast("❌ Failed to submit");

  }

};

/* ───────────────── TOAST ───────────────── */

function showToast(msg){

  const toast =
  document.getElementById("toast");

  toast.textContent = msg;

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },3000);

}

</script>

</body>
</html>
